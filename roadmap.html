<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SIH-Phase-1 Architecture</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Inter,Arial,sans-serif;
    background:#f8fafc;
    color:#0f172a;
}


/* =========================
   TOP BAR
========================= */

.topbar{

    height:64px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 22px;

    background:#ffffff;

    border-bottom:1px solid #dbe4ee;

    position:relative;

    z-index:20;

}

.title{

    font-size:17px;

    font-weight:700;

}

.subtitle{

    font-size:11px;

    color:#64748b;

    margin-top:3px;

}

.controls{

    display:flex;

    gap:7px;

}

.controls button{

    border:1px solid #dbe4ee;

    background:#ffffff;

    padding:8px 12px;

    border-radius:7px;

    cursor:pointer;

    font-size:12px;

    color:#334155;

}

.controls button:hover{

    background:#f1f5f9;

}


/* =========================
   GRAPH AREA
========================= */

#viewport{

    position:absolute;

    top:64px;

    bottom:0;

    left:0;

    right:0;

    overflow:hidden;

    cursor:grab;

    background-color:#fbfdff;

    background-image:

        radial-gradient(#dbe7f0 1.2px,transparent 1.2px);

    background-size:28px 28px;

}

#viewport.dragging{

    cursor:grabbing;

}

#graph{

    width:1600px;

    height:1500px;

    transform-origin:0 0;

    position:absolute;

}


/* =========================
   SVG
========================= */

svg{

    width:1600px;

    height:1500px;

    overflow:visible;

}


/* =========================
   CLUSTERS
========================= */

.cluster{

    fill:#ffffff;

    stroke-width:1.5;

    rx:12;

}

.cluster-title{

    font-size:12px;

    font-weight:700;

    letter-spacing:.3px;

}

.cluster-path{

    font-size:10px;

    fill:#64748b;

}


/* =========================
   NODES
========================= */

.node{

    cursor:pointer;

}

.node rect{

    fill:#ffffff;

    stroke-width:1.5;

    rx:22;

    transition:.18s;

}

.node:hover rect{

    filter:drop-shadow(0 4px 7px rgba(15,23,42,.16));

    stroke-width:2.5;

}

.node text{

    pointer-events:none;

}

.file-name{

    font-size:12px;

    font-weight:600;

    fill:#0f172a;

}

.file-desc{

    font-size:9px;

    fill:#64748b;

}


/* COLORS */

.input rect{

    stroke:#0284c7;

}

.frontend rect{

    stroke:#0ea5e9;

}

.backend rect{

    stroke:#f97316;

}

.ai rect{

    stroke:#9333ea;

}

.retrieval rect{

    stroke:#6366f1;

}

.multimodal rect{

    stroke:#65a30d;

}

.evaluation rect{

    stroke:#059669;

}

.docs rect{

    stroke:#64748b;

}

.support rect{

    stroke:#94a3b8;

}


/* =========================
   EDGES
========================= */

.edge{

    fill:none;

    stroke:#475569;

    stroke-width:1.4;

}

.edge.dashed{

    stroke-dasharray:5 5;

    stroke:#94a3b8;

}

.edge-label{

    font-size:9px;

    fill:#475569;

    paint-order:stroke;

    stroke:#fbfdff;

    stroke-width:5px;

}


/* =========================
   SIDE PANEL
========================= */

#overlay{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(15,23,42,.18);

    z-index:40;

}


#panel{

    position:fixed;

    right:0;

    top:0;

    width:430px;

    height:100vh;

    background:#ffffff;

    border-left:1px solid #dbe4ee;

    box-shadow:-12px 0 35px rgba(15,23,42,.12);

    z-index:50;

    transform:translateX(100%);

    transition:transform .25s ease;

    overflow-y:auto;

}


#panel.open{

    transform:translateX(0);

}


.panel-header{

    padding:22px;

    border-bottom:1px solid #e2e8f0;

}

.panel-header h2{

    margin:0;

    font-size:19px;

}

.path{

    color:#64748b;

    font-family:monospace;

    font-size:11px;

    margin-top:6px;

}

.close{

    position:absolute;

    right:18px;

    top:15px;

    border:none;

    background:none;

    font-size:27px;

    cursor:pointer;

    color:#64748b;

}


.panel-body{

    padding:22px;

}

.section{

    margin-bottom:23px;

}

.section-title{

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:1px;

    color:#7c3aed;

    font-weight:700;

    margin-bottom:8px;

}

.section p{

    font-size:13px;

    line-height:1.6;

    color:#334155;

}

.section ul{

    margin:0;

    padding-left:20px;

}

.section li{

    margin-bottom:7px;

    font-size:13px;

    color:#334155;

}

.function{

    background:#f1f5f9;

    border:1px solid #e2e8f0;

    border-radius:7px;

    padding:8px 10px;

    margin-bottom:7px;

    font-family:monospace;

    font-size:11px;

    color:#334155;

}

.github{

    display:inline-block;

    text-decoration:none;

    background:#0f172a;

    color:white;

    padding:10px 14px;

    border-radius:7px;

    font-size:12px;

}


/* =========================
   LEGEND
========================= */

.legend{

    position:fixed;

    left:18px;

    bottom:18px;

    background:white;

    border:1px solid #dbe4ee;

    border-radius:9px;

    padding:10px 12px;

    z-index:15;

    box-shadow:0 3px 15px rgba(15,23,42,.08);

}

.legend-title{

    font-size:10px;

    font-weight:700;

    color:#64748b;

    margin-bottom:7px;

}

.legend-row{

    display:flex;

    gap:12px;

    font-size:10px;

}

.dot{

    display:inline-block;

    width:8px;

    height:8px;

    border-radius:50%;

    margin-right:4px;

}

</style>

function showInfo(id){

    `;

                    Functions / Responsibilities
                </div>

        `;


        item.functions.forEach(fn=>{

            html += `

        html += `</div>`;

    }


    if(item.input){

                </div>

                    ${item.input}
                </p>

        `;

    }


    if(item.output){

                </div>

                <ul>

        `;


        const outputs =

            : [item.output];


        outputs.forEach(x=>{

            html += `<li>${x}</li>`;

        });


        html += `

            </div>

        `;

    }


    if(item.dependencies){

        `;

    if(item.connections){

/* =====================================================
   PAN + ZOOM
===================================================== */

const graph =
    document.getElementById("graph");

const viewport =
    document.getElementById("viewport");


let scale = 0.72;

let posX = 0;

let posY = 20;

let dragging = false;

let startX = 0;

let startY = 0;


function updateTransform(){

    graph.style.transform =
        `translate(${posX}px,${posY}px) scale(${scale})`;

}


viewport.addEventListener(
    "mousedown",
    function(e){

        if(e.target.closest(".node")){
            return;
        }

        dragging = true;

        viewport.classList.add("dragging");

        startX = e.clientX - posX;

        startY = e.clientY - posY;

    }
);


window.addEventListener(
    "mousemove",
    function(e){

        if(!dragging) return;

        posX = e.clientX - startX;

        posY = e.clientY - startY;

        updateTransform();

    }
);


window.addEventListener(
    "mouseup",
    function(){

        dragging = false;

        viewport.classList.remove("dragging");

    }
);


viewport.addEventListener(
    "wheel",
    function(e){

        e.preventDefault();

        if(e.deltaY < 0){

            scale *= 1.08;

        }else{

            scale *= 0.92;

        }

        scale =
            Math.max(.35,Math.min(1.8,scale));

        updateTransform();

    },
    {passive:false}
);


function zoomIn(){

    scale *= 1.15;

    scale =
        Math.min(1.8,scale);

    updateTransform();

}


function zoomOut(){

    scale *= .87;

    scale =
        Math.max(.35,scale);

    updateTransform();

}


function resetGraph(){

    scale = .72;

    posX = 0;

    posY = 20;

    updateTransform();

}


function fitGraph(){

    const vw =
        viewport.clientWidth;

    const vh =
        viewport.clientHeight;


    const graphWidth = 1600;

    const graphHeight = 1400;


    scale =
        Math.min(
            vw / graphWidth,
            vh / graphHeight
        ) * .92;


    scale =
        Math.max(.35,Math.min(1.2,scale));


    posX =
        (vw - graphWidth * scale) / 2;

    posY =
        (vh - graphHeight * scale) / 2;


    updateTransform();

}


/* =====================================================

===================================================== */

function toggleDirection(){

    direction =
        direction === "TB"
        ? "LR"
        : "TB";


    const button =
        document.querySelector(
            '.controls button:last-child'
        );


    button.textContent =
        direction === "TB"
        ? "Top to Bottom"
        : "Left to Right";


    /*
       The current diagram is intentionally
       top-to-bottom because that matches the
       architecture reference you provided.

       The button is reserved for the future
       horizontal layout.
    */

}

    }
